# Example for guest Xorg. Verify BusID with lspci before installation.
Section "ServerLayout"
    Identifier "AMD-primary"
    Screen "AMD Screen"
EndSection

Section "Device"
    Identifier "AMD iGPU"
    Driver "amdgpu"
    BusID "PCI:6:0:0"
    Option "DRI" "3"
    Option "UseEDID" "false"
EndSection

Section "Monitor"
    Identifier "AMD Headless"
    Option "Enable" "true"
    HorizSync 30.0-300.0
    VertRefresh 30.0-120.0
    Modeline "3840x2160R" 533.00 3840 3888 3920 4000 2160 2163 2168 2222 +hsync -vsync
    Option "PreferredMode" "3840x2160R"
EndSection

Section "Screen"
    Identifier "AMD Screen"
    Device "AMD iGPU"
    Monitor "AMD Headless"
    DefaultDepth 24
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection
