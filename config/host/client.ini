[app]
shmFile=/dev/shm/looking-glass

[spice]
input=yes
captureOnStart=yes
clipboard=yes
clipboardToVM=yes
clipboardToLocal=yes

[input]
captureOnly=no
grabKeyboard=no
rawMouse=yes

[win]
showFPS=yes
jitRender=no
fullScreen=no
maximize=no
autoResize=no
size=1600x900

[egl]
vsync=no

[audio]
micDefault=deny
